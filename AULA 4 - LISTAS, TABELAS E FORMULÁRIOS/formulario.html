<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulártio</title>
</head>

<body>
    <section>
        <h2>Formulário</h2>
        <form action="cadastro.php" method="post">
            <p><label> Nome:</label>
                <input type="text" name="nome" placeholder="Digite seu nome" required>
            </p>
            <p><label>Senha:</label>
                <input type="password" name="senha" required maxlength="8" placeholder="Digite sua senha">
            </p>
            <p><label> E-mail</label>
                <input type="text" name="email" placeholder="Digite seu e-mail" required>
            </p>
            <p><label>Telefone:</label>
                <input type="text" name="telefone" pattern="\([0-9]{2}\) [0-9]{5}0-[0-9]{4}"
                    placeholder="(99)99999-9999" title="Use o formato: (99)99999-9999">
            <p><label>CEP:</label>
                <input type="text" name="cep" pattern="[0-9]{5}-[0-9]{3}" placeholder="00000-000"
                    title="Use o formato: 00000-000" required>
            </p>
            <p><label>Sobre você:</label></p>
            <textarea name="bio" rows="10" cols="100" disabled></textarea>
            <p><label>Gênero:</label>
                <input type="radio" name="genero" value="M"> Masculino
                <input type="radio" name="genero" value="F"> Feminino
            </p>
            <p><label>Interesses:</label>

                <input type="checkbox" name="interesses" value="tecnologia"> Tecnologia
                <input type="checkbox" name="interesses" value="esportes"> Esportes
                <input type="checkbox" name="interesses" value="artes"> Artes
            </p>
            <p><label>País:</label>
                <select name="pais">
                    <option value="">---</option>
                    <option value="brasil">Brasil</option>
                    <option value="argentina">Argentina</option>
                    <option value="chile">Chile</option>
                </select>
            <p><label>Foto de Perfil:</label>
                <input type="file" name="Foto">
            </p>
            </p>
            <input type="submit" value="Enviar">
            <input type="reset" value="Limpar">
        </form>
    </section>
</body>

</html>
