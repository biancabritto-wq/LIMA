<!DOCTYPE html>
<html lang="br-pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Box Model</title>
    <style>
        div {
            margin: 20px;
        }
        .content-box{
            background-color: hotpink;
            width: 300px;
            padding: 25px;
            border: 5px solid lightpink;
            box-sizing: content-box;
        }
        .border-box{
            background-color: orange;
            width: 300px;
            padding: 25px;
            border: 5px solid rgb(252, 202, 107);
            box-sizing: border-box;
        }
        </style>
</head>
<body>
    <h1>Exemplos box-level e inline-level</h1>
    <p>Parágrafo é box-level (quebra de linha automaricamente), mas os <a href="#">Links são inline-level</a>
    (permanecem na mesma linha)</p>

    <h2>Box-sizing:</h2>
    <div class="content-box"> Content-box (padrão)</div>
    <div class="border-box"> Border-box</div>
</body>
</html>
